schema: spec-driven

rules:
  tasks:
    - 'Group tasks into PR-sized slices under headings like "## PR 1: <title>", and state which earlier slice each one depends on.'
    - 'Each slice must be independently reviewable and shippable, and must leave master green. Each slice keeps its own tests, verification, and review tasks.'
    - 'Order slices so each depends only on earlier ones (for example schema or backend, then API, then UI).'
    - 'Size slices for a human reviewer, with one concern per slice. About 200 changed lines including specs is a ceiling, not a goal: smaller is better. Whenever a slice can be split further along its own layers while each part stays independently shippable and meaningful on its own, split it, even if it is already under 200 lines. A slice that cannot be split cleanly may run over. Always split refactors from behavior changes.'
    - 'Do not over-split. Merge slices whose diffs say little without their neighbors, meaning a reviewer cannot judge the diff without opening another slice. More than 6 slices needs a stated reason.'
    - 'Balance the slices. If one carries most of the work and another is trivial, move the boundary before finalizing.'
    - 'State the estimated changed lines next to each slice heading so the split can be checked before implementation.'
